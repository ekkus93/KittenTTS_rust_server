name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_model:
        description: "Run live ONNX model-backed HTTP smoke tests"
        type: boolean
        default: false
      run_benchmark:
        description: "Benchmark real-model inference (requires run_real_model)"
        type: boolean
        default: false
      run_docker:
        description: "Build and smoke-test the Docker image (requires run_real_model)"
        type: boolean
        default: false
      run_systemd:
        description: "Install and exercise the real model through systemd (requires run_real_model)"
        type: boolean
        default: false
      probe_python_reference:
        description: "Discover exact Python reference repo commit and runtime metadata"
        type: boolean
        default: false
      model_revision:
        description: "Exact Hugging Face model commit SHA or main (resolved per run)"
        type: string
        default: "e73cfb095bd949c786ccdcf3b8ab04eb36c47442"

permissions:
  contents: read

# Record immutable backend and toolchain revisions for reproducible builds.
# Change these deliberately, not as an incidental default-branch update.
env:
  BACKEND_SHA: "df7718161bc68c8b13bea85e879308becf12e87b"
  ORT_VERSION: "1.24.2"
  MODEL_REPO: "KittenML/kitten-tts-nano-0.8-fp32"

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out Rust server repo
        uses: actions/checkout@v4

      - name: Check out backend repo
        uses: actions/checkout@v4
        with:
          repository: ekkus93/kitten_tts_rs
          path: kitten_tts_rs
          ref: df7718161bc68c8b13bea85e879308becf12e87b

      - name: Confirm backend revision
        run: |
          actual="$(git -C kitten_tts_rs rev-parse HEAD)"
          test "$actual" = "$BACKEND_SHA"
          echo "server=$GITHUB_SHA backend=$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Expose sibling backend path dependency
        run: ln -s "$GITHUB_WORKSPACE/kitten_tts_rs" "$GITHUB_WORKSPACE/../kitten_tts_rs"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            clang \
            cmake \
            espeak-ng \
            libgomp1 \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Compile real-backend feature
        run: cargo check --features real-backend

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Validate opt-in Python harness syntax
        run: python3 -m py_compile tests/live_backend_smoke.py tests/compare_python_rust.py tests/benchmark_real_tts.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Check out Rust server repo
        uses: actions/checkout@v4

      - name: Check out backend repo
        uses: actions/checkout@v4
        with:
          repository: ekkus93/kitten_tts_rs
          path: kitten_tts_rs
          ref: df7718161bc68c8b13bea85e879308becf12e87b

      - name: Confirm backend revision
        run: |
          actual="$(git -C kitten_tts_rs rev-parse HEAD)"
          test "$actual" = "$BACKEND_SHA"
          echo "server=$GITHUB_SHA backend=$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Expose sibling backend path dependency
        run: ln -s "$GITHUB_WORKSPACE/kitten_tts_rs" "$GITHUB_WORKSPACE/../kitten_tts_rs"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            clang \
            cmake \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --features real-backend

      - name: Package release assets
        run: |
          mkdir -p dist
          cp target/release/kittentts-server-rs dist/kittentts-server-rs-linux-x86_64
          cp config/settings.example.json dist/settings.example.json
          cp config/systemd/kittentts-server-rs.service dist/kittentts-server-rs.service
          tar -C dist -czf dist/kittentts-server-rs-linux-x86_64.tar.gz \
            kittentts-server-rs-linux-x86_64 \
            settings.example.json \
            kittentts-server-rs.service
          sha256sum \
            dist/kittentts-server-rs-linux-x86_64 \
            dist/kittentts-server-rs-linux-x86_64.tar.gz \
            > dist/sha256sums.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kittentts-server-rs-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/kittentts-server-rs-linux-x86_64
            dist/kittentts-server-rs-linux-x86_64.tar.gz
            dist/sha256sums.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kittentts-server-rs-linux-x86_64
            dist/kittentts-server-rs-linux-x86_64.tar.gz
            dist/sha256sums.txt

  # Expensive validation is opt-in: workflow_dispatch, or an explicitly marked
  # commit on master. The normal push pipeline remains lint/test only.
  # No new tag is minted and nothing is published from this job.
  verify_release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[run-real-model]'))
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out server at dispatched revision
        uses: actions/checkout@v4

      - name: Check out reviewed backend revision
        uses: actions/checkout@v4
        with:
          repository: ekkus93/kitten_tts_rs
          path: kitten_tts_rs
          ref: df7718161bc68c8b13bea85e879308becf12e87b

      - name: Check backend identity and expose sibling dependency
        run: |
          test "$(git -C kitten_tts_rs rev-parse HEAD)" = "$BACKEND_SHA"
          ln -s "$GITHUB_WORKSPACE/kitten_tts_rs" "$GITHUB_WORKSPACE/../kitten_tts_rs"

      - name: Install compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake libssl-dev pkg-config

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build optimized real-backend binary
        run: cargo build --release --locked --features real-backend

      - name: Record release-build provenance
        run: |
          echo "server=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "backend=$BACKEND_SHA" >> "$GITHUB_STEP_SUMMARY"
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum target/release/kittentts-server-rs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload release binary for opt-in model tests
        uses: actions/upload-artifact@v4
        with:
          name: real-backend-binary-${{ github.sha }}
          path: target/release/kittentts-server-rs
          retention-days: 3
          if-no-files-found: error

  real_model:
    # Run only via explicit dispatch or opt-in commit marker on master.
    if: (github.event_name == 'workflow_dispatch' && inputs.run_real_model == true) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[run-real-model]'))
    needs: verify_release
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      KITTENTTS_SERVER_AUTH_ENABLED: "false"
    steps:
      - name: Set runner-local model and ONNX paths
        run: |
          echo "ORT_DYLIB_PATH=$RUNNER_TEMP/onnxruntime/lib/libonnxruntime.so.1.24.2" >> "$GITHUB_ENV"
          echo "KITTENTTS_SERVER_MODEL_DIR=$RUNNER_TEMP/kittentts-model" >> "$GITHUB_ENV"

      - name: Check out server scripts at dispatched revision
        uses: actions/checkout@v4

      - name: Download exactly validated release binary
        uses: actions/download-artifact@v4
        with:
          name: real-backend-binary-${{ github.sha }}
          path: dist

      - name: Select Python 3.13 with pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare executable and required OS libraries
        run: |
          chmod +x dist/kittentts-server-rs
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y ca-certificates curl espeak-ng libgomp1

      - name: Install pinned ONNX Runtime library from a PyPI binary wheel
        run: |
          set -euo pipefail
          # The v1.24.2 GitHub release-asset URL returned HTTP 404 on the
          # 2026-11-18 GitHub runner. PyPI publishes the same versioned
          # libonnxruntime.so and its companion provider libraries in a wheel.
          mkdir -p "$RUNNER_TEMP/onnxruntime-wheel"
          python3 -m pip download --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/onnxruntime-wheel" "onnxruntime==$ORT_VERSION"
          wheel="$(find "$RUNNER_TEMP/onnxruntime-wheel" -maxdepth 1 -type f -name 'onnxruntime-*.whl' -print -quit)"
          test -n "$wheel"
          python3 -m zipfile -e "$wheel" "$RUNNER_TEMP/onnxruntime-extracted"
          library="$(find "$RUNNER_TEMP/onnxruntime-extracted/onnxruntime/capi" -maxdepth 1 \
            -type f -name 'libonnxruntime.so*' -print -quit)"
          test -n "$library" && test -s "$library"
          echo "ORT_DYLIB_PATH=$library" >> "$GITHUB_ENV"
          sha256sum "$wheel" "$library" | tee "$RUNNER_TEMP/onnxruntime.sha256"
          echo "ONNX Runtime $ORT_VERSION extracted from a versioned PyPI wheel" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve exact Hugging Face model revision
        env:
          MODEL_REVISION_REQUESTED: "${{ inputs.model_revision }}"
        run: |
          set -euo pipefail
          if [[ "$MODEL_REVISION_REQUESTED" == "main" || -z "$MODEL_REVISION_REQUESTED" ]]; then
            model_sha="$(curl -fLsS --retry 3 "https://huggingface.co/api/models/$MODEL_REPO" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          else
            model_sha="$MODEL_REVISION_REQUESTED"
          fi
          [[ "$model_sha" =~ ^[a-fA-F0-9]{40}$ ]] || { echo "Model revision must be an exact commit SHA or main"; exit 1; }
          echo "MODEL_SHA=$model_sha" >> "$GITHUB_ENV"
          echo "Resolved $MODEL_REPO to immutable revision $model_sha"

      - name: Cache model files at resolved revision
        uses: actions/cache@v4
        with:
          path: "${{ runner.temp }}/kittentts-model"
          key: kitten-nano-fp32-${{ env.MODEL_SHA }}

      - name: Fetch model assets from immutable revision
        run: |
          set -euo pipefail
          mkdir -p "$KITTENTTS_SERVER_MODEL_DIR"
          url="https://huggingface.co/$MODEL_REPO/resolve/$MODEL_SHA"
          curl -fL --retry 3 --retry-all-errors -o "$KITTENTTS_SERVER_MODEL_DIR/config.json" "$url/config.json"
          model_file="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["model_file"])' "$KITTENTTS_SERVER_MODEL_DIR/config.json")"
          voice_file="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["voices"])' "$KITTENTTS_SERVER_MODEL_DIR/config.json")"
          # Keep downloaded assets inside the temp model directory.
          [[ "$model_file" != */* && "$voice_file" != */* && -n "$model_file" && -n "$voice_file" ]] || exit 1
          for name in "$model_file" "$voice_file"; do
            if [[ ! -s "$KITTENTTS_SERVER_MODEL_DIR/$name" ]]; then
              curl -fL --retry 3 --retry-all-errors -o "$KITTENTTS_SERVER_MODEL_DIR/$name" "$url/$name"
            fi
            test -s "$KITTENTTS_SERVER_MODEL_DIR/$name"
          done
          echo "model_repo=$MODEL_REPO model_sha=$MODEL_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "server=$GITHUB_SHA backend=$BACKEND_SHA ort=$ORT_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Run actual ONNX HTTP WAV/PCM smoke test
        run: |
          set -euo pipefail
          python3 tests/live_backend_smoke.py \
            --binary dist/kittentts-server-rs --startup-timeout 300 --request-timeout 180 \
            2>&1 | tee "$RUNNER_TEMP/live-model-smoke.log"

      - name: Benchmark real ONNX inference (optional)
        if: inputs.run_benchmark == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-benchmark]'))
        env:
          KITTENTTS_SERVER_HOST: "127.0.0.1"
          KITTENTTS_SERVER_PORT: "8009"
        run: |
          set -euo pipefail
          dist/kittentts-server-rs > "$RUNNER_TEMP/benchmark-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 150); do
            kill -0 "$server_pid" || { cat "$RUNNER_TEMP/benchmark-server.log"; exit 1; }
            if curl -fsS "http://127.0.0.1:8009/healthz" | grep -q '"model_loaded":true'; then
              ready=1
              break
            fi
            sleep 2
          done
          [[ "$ready" == 1 ]] || { echo "benchmark server not ready"; exit 1; }
          python3 tests/benchmark_real_tts.py \
            --url "http://127.0.0.1:8009" --requests 8 --concurrency 1 2 4 \
            --pid "$server_pid" --server-ref "$GITHUB_SHA" \
            --backend-ref "$BACKEND_SHA" --model-ref "$MODEL_SHA" \
            --output "$RUNNER_TEMP/real-tts-benchmark.json"

      - name: Check out reviewed backend for container build (optional)
        if: inputs.run_docker == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-docker]'))
        uses: actions/checkout@v4
        with:
          repository: ekkus93/kitten_tts_rs
          ref: df7718161bc68c8b13bea85e879308becf12e87b
          path: kitten_tts_rs

      - name: Build Docker image and test actual model-backed speech (optional)
        if: inputs.run_docker == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-docker]'))
        run: |
          set -euo pipefail
          test "$(git -C kitten_tts_rs rev-parse HEAD)" = "$BACKEND_SHA"
          docker buildx build --load \
            --build-context kitten_tts_rs=./kitten_tts_rs \
            --tag kittentts-rs:ci --build-arg "ONNXRUNTIME_VERSION=$ORT_VERSION" .
          docker run --detach --rm --name kittentts-rs-validation \
            --publish 127.0.0.1:18008:8008 \
            --mount "type=bind,source=$KITTENTTS_SERVER_MODEL_DIR,target=/models,readonly" \
            --env KITTENTTS_SERVER_MODEL_DIR=/models \
            kittentts-rs:ci
          trap 'docker logs kittentts-rs-validation > "$RUNNER_TEMP/docker-server.log" 2>&1 || true; docker rm -f kittentts-rs-validation >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            docker inspect --format '{{.State.Running}}' kittentts-rs-validation | grep -qx true || { docker logs kittentts-rs-validation; exit 1; }
            if curl -fsS "http://127.0.0.1:18008/healthz" | grep -q '"model_loaded":true'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { docker logs kittentts-rs-validation; exit 1; }
          python3 tests/benchmark_real_tts.py \
            --url http://127.0.0.1:18008 --concurrency 1 --requests 2 \
            --server-ref "$GITHUB_SHA" --backend-ref "$BACKEND_SHA" \
            --model-ref "$MODEL_SHA" --output "$RUNNER_TEMP/docker-tts-smoke.json"
          echo "Docker image built and served real, validated WAV audio" >> "$GITHUB_STEP_SUMMARY"

      - name: Install and smoke-test actual systemd service (optional)
        if: inputs.run_systemd == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-systemd]'))
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu is a VM. Explicitly require systemd as PID 1:
          # testing a process launched directly would not be a service test.
          test "$(ps -p 1 -o comm= | tr -d '[:space:]')" = systemd || {
            echo "This runner does not boot systemd as PID 1"; exit 1;
          }
          unit=kittentts-server-rs.service
          root=/opt/kittentts-server-rs
          cleanup() {
            sudo journalctl -u "$unit" --no-pager -n 150 > "$RUNNER_TEMP/systemd-journal.log" 2>&1 || true
            sudo systemctl stop "$unit" 2>/dev/null || true
            sudo systemctl disable "$unit" 2>/dev/null || true
            sudo rm -f "/etc/systemd/system/$unit" /etc/default/kittentts-server-rs
            sudo systemctl daemon-reload || true
          }
          trap cleanup EXIT
          if ! id -u kittentts-server >/dev/null 2>&1; then
            sudo useradd --system --home-dir "$root" --shell /usr/sbin/nologin kittentts-server
          fi
          sudo install -d -o kittentts-server -g kittentts-server \
            "$root" "$root/bin" "$root/config" "$root/models/nano" \
            "$root/.cache/huggingface" "$root/lib/onnxruntime/$ORT_VERSION"
          sudo install -m 0755 dist/kittentts-server-rs "$root/bin/kittentts-server-rs"
          sudo install -m 0644 config/settings.example.json "$root/config/settings.json"
          sudo install -m 0644 config/systemd/kittentts-server-rs.service "/etc/systemd/system/$unit"
          sudo cp -a "$KITTENTTS_SERVER_MODEL_DIR/." "$root/models/nano/"
          sudo cp "$RUNNER_TEMP"/onnxruntime-extracted/onnxruntime/capi/libonnxruntime*.so* \
            "$root/lib/onnxruntime/$ORT_VERSION/"
          sudo chown -R kittentts-server:kittentts-server "$root"
          sudo chmod -R a+rX "$root/models/nano" "$root/lib/onnxruntime"
          printf 'ORT_DYLIB_PATH=%s\nKITTENTTS_SERVER_MODEL_DIR=%s\n' \
            "$root/lib/onnxruntime/$ORT_VERSION/libonnxruntime.so.$ORT_VERSION" \
            "$root/models/nano" | sudo tee /etc/default/kittentts-server-rs >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl start "$unit"
          ready=0
          for attempt in $(seq 1 120); do
            sudo systemctl is-active --quiet "$unit" || { sudo journalctl -u "$unit" -n 100 --no-pager; exit 1; }
            if curl -fsS http://127.0.0.1:8008/healthz 2>/dev/null \
              | python3 -c 'import json,sys; assert json.load(sys.stdin)["model_loaded"] is True' 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { sudo journalctl -u "$unit" -n 100 --no-pager; exit 1; }
          python3 tests/benchmark_real_tts.py \
            --url http://127.0.0.1:8008 --concurrency 1 --requests 2 \
            --server-ref "$GITHUB_SHA" --backend-ref "$BACKEND_SHA" \
            --model-ref "$MODEL_SHA" \
            --output "$RUNNER_TEMP/systemd-tts-smoke.json"
          # Exercise systemd restart/stop as separate lifecycle assertions.
          sudo systemctl restart "$unit"
          sudo systemctl is-active --quiet "$unit"
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8008/healthz 2>/dev/null \
              | python3 -c 'import json,sys; assert json.load(sys.stdin)["model_loaded"] is True' 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { sudo journalctl -u "$unit" -n 100 --no-pager; exit 1; }
          sudo systemctl stop "$unit"
          ! sudo systemctl is-active --quiet "$unit"
          echo "PASS systemd install, real WAV audio, restart, health, and stop" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded test evidence (never model weights or synthesized audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/live-model-smoke.log
            ${{ runner.temp }}/onnxruntime.sha256
            ${{ runner.temp }}/real-tts-benchmark.json
            ${{ runner.temp }}/benchmark-server.log
            ${{ runner.temp }}/docker-tts-smoke.json
            ${{ runner.temp }}/docker-server.log
            ${{ runner.temp }}/systemd-tts-smoke.json
            ${{ runner.temp }}/systemd-journal.log
          if-no-files-found: warn
          retention-days: 7

  # Separate from Rust validation and actual parity; discovery does not
  # imply the Python implementation is available or compatible.
  python_reference_probe:
    if: (github.event_name == 'workflow_dispatch' && inputs.probe_python_reference == true) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[probe-python-reference]'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Resolve reference repository and exact default-branch revision
        run: |
          set -euo pipefail
          url="https://github.com/ekkus93/KittenTTS_server.git"
          # No secrets, cross-repository write token, or credential helper.
          git -c credential.helper= clone --depth 1 --filter=blob:none "$url" reference
          sha="$(git -C reference rev-parse HEAD)"
          branch="$(git -C reference branch --show-current)"
          [[ "$sha" =~ ^[a-fA-F0-9]{40}$ ]] || exit 1
          echo "Python reference SHA: $sha (branch: $branch)"
          echo "python_reference=ekkus93/KittenTTS_server" >> "$GITHUB_STEP_SUMMARY"
          echo "python_ref=$sha" >> "$GITHUB_STEP_SUMMARY"
          echo "python_branch=$branch" >> "$GITHUB_STEP_SUMMARY"
          echo "PYTHON_REFERENCE_SHA=$sha" >> "$GITHUB_ENV"
          echo "PYTHON_REFERENCE_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Inspect package, entrypoint, and API surface without executing source
        run: |
          python3 - <<'PY'
          import ast
          import json
          import os
          from pathlib import Path

          root = Path("reference")
          result = {
              "repository": "ekkus93/KittenTTS_server",
              "sha": os.environ["PYTHON_REFERENCE_SHA"],
              "branch": os.environ["PYTHON_REFERENCE_BRANCH"],
              "files": sorted(str(p.relative_to(root)) for p in root.glob("*") if p.is_file()),
              "python_modules": {},
              "dependencies": {},
              "documented_commands": [],
          }
          for path in sorted((root / "app").glob("*.py")):
              parsed = ast.parse(path.read_text(encoding="utf-8"))
              exports = [node.name for node in parsed.body
                         if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))]
              imports = []
              for node in parsed.body:
                  if isinstance(node, ast.Import):
                      imports += [x.name for x in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imports.append(node.module)
              result["python_modules"][str(path.relative_to(root))] = {
                  "exports": exports[:50], "imports": sorted(set(imports))[:50]
              }
          for name in ("requirements.txt", "requirements-dev.txt", "pyproject.toml",
                       "Pipfile", "environment.yml"):
              path = root / name
              if path.is_file():
                  data = path.read_text(encoding="utf-8")
                  result["dependencies"][name] = [
                      line.strip()[:150] for line in data.splitlines()[:120]
                      if line.strip() and not line.strip().startswith("#")
                  ]
          for name in ("README.md", "Dockerfile", "docker-compose.yml",
                       "compose.yaml", "Makefile"):
              path = root / name
              if path.is_file():
                  for raw in path.read_text(encoding="utf-8").splitlines():
                      line = raw.strip()
                      keywords = ("uvicorn", "gunicorn", "pip install", "python -m",
                                  "requirements.txt", "docker compose", "CMD [")
                      if any(key in line.lower() for key in keywords):
                          result["documented_commands"].append({"file": name, "line": line[:220]})
          dest = Path(os.environ["RUNNER_TEMP"]) / "python-reference-probe.json"
          dest.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PYTHON REFERENCE METADATA (bounded, no raw source or model assets)")
          print(json.dumps(result, indent=2)[:16000])
          PY

      - name: Upload Python reference metadata only
        uses: actions/upload-artifact@v4
        with:
          name: python-reference-probe-${{ github.sha }}
          path: ${{ runner.temp }}/python-reference-probe.json
          retention-days: 7
          if-no-files-found: error
